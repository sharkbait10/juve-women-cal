name: Update calendar

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "overrides.yml"
      - "config.yml"
      - "build_calendar.py"
      - "broadcast.py"

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build calendar
        run: python build_calendar.py --verbose

      - name: Commit and push if the feed changed
        run: |
          set -euo pipefail

          if git diff --quiet -- docs/juventus-women.ics; then
            echo "Feed unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/juventus-women.ics
          git commit -m "Update fixtures ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing (attempt $attempt)."
            git pull --rebase --autostash origin main
          done

          echo "Could not push after 3 attempts." >&2
          exit 1
